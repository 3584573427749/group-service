components:
  schemas:
    ErrorResponse:
      type: object
      required:
        - type
        - message
      properties:
        type:
          type: string
        message:
          type: string
        details:
          type: object
          nullable: true
          additionalProperties: true

    CreateGroupLevelRequest:
      type: object
      required:
        - name
        - sortOrder
      properties:
        name:
          type: string
          minLength: 2
          example: Beginner
        description:
          type: string
          example: A group for beginners
        sortOrder:
          type: integer
          example: 1

    UpdateGroupLevelRequest:
      type: object
      required:
        - id
        - name
        - sortOrder
      properties:
        id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        name:
          type: string
          minLength: 2
          example: Beginner
        description:
          type: string
          example: A group for beginners
        sortOrder:
          type: integer
          example: 1
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true

    GroupLevel:
      type: object
      required:
        - id
        - name
        - description
        - sortOrder
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        name:
          type: string
          minLength: 2
          example: Beginner
        description:
          type: string
          example: A group for beginners
        sortOrder:
          type: integer
          example: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true

    CreateGroupRequest:
      type: object
      required:
        - groupLevelId
        - name
        - venue
        - active
        - competitive
      properties:
        groupLevelId:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        name:
          type: string
          minLength: 2
          example: Beginner
        description:
          type: string
          example: A group for beginners
        venue:
          type: string
          enum:
            - Mariebad
            - Ålands Idrottscenter
          example: Mariebad
        active:
          type: integer
          enum:
            - 0
            - 1
          example: 1
        competitive:
          type: integer
          enum:
            - 0
            - 1
          example: 1

    UpdateGroupRequest:
      type: object
      required:
        - id
        - groupLevelId
        - name
        - venue
        - active
        - competitive
      properties:
        id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        groupLevelId:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        name:
          type: string
          minLength: 2
          example: Beginner
        description:
          type: string
          example: A group for beginners
        venue:
          type: string
          enum:
            - Mariebad
            - Ålands Idrottscenter
          example: Mariebad
        active:
          type: integer
          enum:
            - 0
            - 1
          example: 1
        competitive:
          type: integer
          enum:
            - 0
            - 1
          example: 1

    Group:
      type: object
      required:
        - id
        - groupLevelId
        - name
        - description
        - venue
        - active
        - competitive
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        groupLevelId:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        name:
          type: string
          minLength: 2
          example: Beginner
        description:
          type: string
          example: A group for beginners
        venue:
          type: string
          enum:
